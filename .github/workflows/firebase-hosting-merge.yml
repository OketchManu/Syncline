name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repo
      - uses: actions/checkout@v4

      # 2. Install dependencies & build CRA inside web/
      - name: Install dependencies
        run: npm --prefix web install

      - name: Build
        run: npm --prefix web run build

      # 3. Deploy to Firebase Hosting
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SYNCLINE_8010E }}
          channelId: live
          projectId: syncline-8010e
          # Important: tells Firebase Hosting where the build folder is
          # For CRA, it's always web/build
          # The action uses this automatically if you deploy from the root of the CRA build
          # So we set working-directory implicitly by running build inside web/