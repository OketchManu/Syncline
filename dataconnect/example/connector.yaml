connectorId: example
generate:
  kotlinSdk:
    - outputDir: ..\..\notifier\src\main\kotlin
      package: com.google.firebase.dataconnect.generated
  javascriptSdk:
    - outputDir: ..\..\src\dataconnect-generated
      package: "@dataconnect/generated"
      packageJsonDir: ..\..
      react: false
      angular: false
    - outputDir: ..\..\web\src\dataconnect-generated
      package: "@dataconnect/generated"
      packageJsonDir: ..\..\web
      react: true
      angular: false
    - outputDir: ..\..\api\src\dataconnect-generated
      package: "@dataconnect/generated"
      packageJsonDir: ..\..\api
      react: false
      angular: false
