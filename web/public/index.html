<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- ── Favicon ── -->
    <!-- Primary: SVG favicon (scales perfectly, shown in tabs) -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <!-- Fallback: ICO for older browsers -->
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" sizes="64x64" />
    <!-- Apple touch icon (home screen on iOS) -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- ── Viewport & theme ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- ── SEO ── -->
    <meta name="description" content="Syncline — Real-Time Operations Platform for teams and individuals." />
    <meta name="application-name" content="Syncline" />

    <!-- ── Open Graph ── -->
    <meta property="og:title"       content="Syncline" />
    <meta property="og:description" content="Real-Time Operations Platform" />
    <meta property="og:type"        content="website" />

    <!-- ── Manifest ── -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ── Font preconnect (DM Sans used in Dashboard) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>Syncline</title>

    <style>
      /* Prevent flash of unstyled content */
      html, body { margin: 0; padding: 0; background: #05080f; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Syncline.</noscript>
    <div id="root"></div>
  </body>
</html>
